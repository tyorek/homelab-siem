#######################################################################################################
# Forward Suricata eve.json (alert, drop, anomaly, http, tls, ssh records) to the syslog collector
# CT 112 at 192.168.99.11:514 as program "suricata-eve", local5.info. Added 2026-11-23.
# Hand-maintained drop-in, not generated by an OPNsense template: syslog-ng reconfigures leave it alone.
# Wazuh gets eve.json through the manager's agent.conf (fw-edge block, http/tls ignored), not through here.
# Record: claude workspace/Runbooks & Setup Guides/syslog-collector-build-record-2026-11-23.md
#######################################################################################################
source s_eve_collector {
    file("/var/log/suricata/eve.json"
         follow-freq(1)
         flags(no-parse)
         program-override("suricata-eve")
         default-facility(local5)
         default-priority(info)
         log-msg-size(65536));
};

destination d_eve_collector {
    network("192.168.99.11" port(514) transport("udp") ip-protocol(4));
};

log {
    source(s_eve_collector);
    destination(d_eve_collector);
};
