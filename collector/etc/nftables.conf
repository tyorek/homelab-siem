#!/usr/sbin/nft -f
# syslog collector host firewall - runbook section 3.6 (sources kept in named sets; add with
#   nft add element inet filter syslog_src { a.b.c.d }   and mirror the change here)
flush ruleset
table inet filter {
  set syslog_src {
    type ipv4_addr
    elements = { 192.168.99.1, 192.168.99.4, 192.168.99.5, 192.168.99.6, 172.16.255.1,
                 192.168.15.9, 192.168.15.10, 192.168.15.11,
                 10.20.0.9, 10.20.0.13, 10.20.0.14 }
  }
  set flow_src {
    type ipv4_addr
    elements = { 192.168.99.1, 172.16.255.1 }
  }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr @syslog_src udp dport 514 accept
    ip saddr @flow_src udp dport 2055 accept
    ip saddr { 192.168.5.9, 192.168.99.2 } tcp dport 22 accept
    icmp type echo-request accept
  }
}
