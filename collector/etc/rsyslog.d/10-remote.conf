# Remote syslog collector - see rsyslog-collector-standup-runbook.md section 3.5
# Source IP -> device name: /etc/rsyslog-devmap.json. Program name -> separate stream file: /etc/rsyslog-streammap.json
# (empty = the device's main log). Both are lookup tables reloaded on HUP: edit, then `systemctl kill -s HUP rsyslog`.
# New sources also go in the nftables set syslog_src. No restart needed, so fw-edge's feed isn't interrupted.
global(net.enableDNS="off")

module(load="imudp")
input(type="imudp" port="514" ruleset="remote")

lookup_table(name="devmap"    file="/etc/rsyslog-devmap.json"    reloadOnHUP="on")
lookup_table(name="streammap" file="/etc/rsyslog-streammap.json" reloadOnHUP="on")

template(name="RemoteFile" type="string" string="/var/log/remote/%$.dev%/%$.dev%.log")
template(name="StreamFile" type="string" string="/var/log/remote/%$.dev%/%$.stream%.log")
template(name="RemoteLine" type="string"
         string="%timegenerated:::date-rfc3339% %fromhost-ip% %pri-text% %rawmsg-after-pri%\n")

ruleset(name="remote") {
  set $.dev = lookup("devmap", $fromhost-ip);
  set $.stream = lookup("streammap", $programname);
  # High-volume record streams (fw-edge Suricata eve.json -> eve.log, Technitium query logs -> queries.log) get their own file
  if $.stream != "" then {
    action(type="omfile" dynaFile="StreamFile" template="RemoteLine"
           fileCreateMode="0640" dirCreateMode="0750" fileGroup="adm" dirGroup="adm")
    stop
  }
  action(type="omfile" dynaFile="RemoteFile" template="RemoteLine"
         fileCreateMode="0640" dirCreateMode="0750" fileGroup="adm" dirGroup="adm")
  stop
}
