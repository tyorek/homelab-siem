<!--
  Centralized agent config: add this block inside /var/ossec/etc/shared/default/agent.conf on siem
  (keep the existing <agent_config> element; this one only applies to the agent named pibox).
  The manager pushes it to pibox's agent, which restarts itself; no shell on pibox needed.
  Path from the NPM compose file in OMV (data volume -> /data, logs in /data/logs).
-->
<agent_config name="pibox">
  <localfile>
    <log_format>syslog</log_format>
    <location>/srv/dev-disk-by-uuid-cfdb5281-09b1-4b52-a5ee-423579a88cec/data/nginxproxymanager/data/logs/proxy-host-*_access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/srv/dev-disk-by-uuid-cfdb5281-09b1-4b52-a5ee-423579a88cec/data/nginxproxymanager/data/logs/fallback_access.log</location>
  </localfile>
</agent_config>
