# Forward to the syslog collector (CT 112, 192.168.99.11:514/udp). Added 2026-11-23.
# Everything at info and above; debug stays local. In-memory queue so a collector outage never blocks local logging.
*.info action(type="omfwd" target="192.168.99.11" port="514" protocol="udp"
              template="RSYSLOG_TraditionalForwardFormat"
              queue.type="LinkedList" queue.size="10000" action.resumeRetryCount="-1")
